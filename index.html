<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>syra.v</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ff007a; /* PINK BACKGROUND */
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      filter: blur(5px);
      opacity: 0;
      transition: filter 3s ease, opacity 3s ease;
    }

    body.loaded {
      filter: blur(0);
      opacity: 1;
    }

    header {
      background-color: #ff007a;
      color: white;
      padding: 15px 20px;
      text-align: left;
      border: 2px solid white;
      margin: 10px;
      border-radius: 5px;
      position: relative;
    }

    h1 {
      margin: 0;
      font-size: 1.25em;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .description {
      margin: 20px auto;
      max-width: 800px;
      padding: 0 20px;
      font-size: 1.2em;
      color: rgba(255,255,255,0.8);
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
      text-align: center;
    }

    input {
      padding: 12px;
      width: 70%;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    button {
      padding: 12px 24px;
      background-color: white;
      color: #ff007a;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .result {
      margin-top: 20px;
      font-size: 1em;
    }

    .avatar {
      border-radius: 50%;
      margin: 10px 0;
      border: 2px solid white;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.75em;
      color: rgba(255,255,255,0.7);
      border-top: 1px solid white;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>syra.v</h1>
  </header>

  <div class="description">
    Enter a Roblox username to view profile info.
  </div>

  <div class="container">
    <input type="text" id="username" placeholder="Enter Roblox username" />
    <br />
    <button onclick="lookup()">Search</button>

    <div class="result" id="result"></div>
  </div>

  <footer>&copy; 2025 syraa.dev | Built by Syra</footer>

  <script>
    window.addEventListener('load', () => {
      document.body.classList.add('loaded');
    });

    async function lookup() {
      const username = document.getElementById("username").value.trim();
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "Searching...";

      try {
        // Step 1: Get user ID
        const res = await fetch("https://api.roproxy.com/v1/usernames/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usernames: [username], excludeBannedUsers: false })
        });

        const userData = await res.json();
        if (!userData.data || userData.data.length === 0) {
          resultDiv.innerHTML = "User not found.";
          return;
        }

        const user = userData.data[0];
        const userId = user.id;

        // Step 2: Get avatar and profile
        const [avatarRes, descRes] = await Promise.all([
          fetch(`https://api.roproxy.com/v1/users/${userId}/avatar`),
          fetch(`https://api.roproxy.com/v1/users/${userId}`)
        ]);

        const avatarData = await avatarRes.json();
        const descData = await descRes.json();

        const avatarUrl = `https://www.roblox.com/headshot-thumbnail/image?userId=${userId}&width=150&height=150&format=png`;

        resultDiv.innerHTML = `
          <img src="${avatarUrl}" class="avatar" width="100" height="100" />
          <p><strong>Username:</strong> ${user.username}</p>
          <p><strong>Display Name:</strong> ${user.displayName}</p>
          <p><strong>User ID:</strong> ${userId}</p>
          <p><strong>Status:</strong> ${descData.statusMessage || "No status"}</p>
          <p><strong>Description:</strong><br>${descData.description || "No bio"}</p>
        `;
      } catch (err) {
        resultDiv.innerHTML = "Error fetching user data.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
